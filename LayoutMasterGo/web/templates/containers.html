<div x-data="containersComponent()" x-init="init()">
    
    <!-- 1. VISUALIZAÇÃO DE LISTA DE CONTÊINERES -->
    <template x-if="viewMode === 'list'">
        <div>
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Gerenciamento de Contêineres</h2>
                <div class="d-flex gap-2" style="width: 500px;">
                    <input type="text" 
                           x-model="searchQuery" 
                           @input.debounce.300ms="onSearch()" 
                           class="form-control" 
                           placeholder="Buscar por nome ou status...">
                    
                    <button class="btn btn-primary text-nowrap" @click="openCreateMode()">
                        <i class="bi bi-plus-lg me-1"></i> Novo Contêiner
                    </button>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Nome do Contêiner</th>
                                <th>Status</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="c in containers" :key="c.ID || c.id">
                                <tr>
                                    <td x-text="c.name || c.Name"></td>
                                    <td><span class="badge bg-secondary" x-text="c.status || c.Status"></span></td>
                                    <td class="text-end">
                                        <button class="btn btn-sm btn-info text-white" @click="viewDetails(c.ID || c.id)">
                                            <i class="bi bi-box-open me-1"></i> Ver Itens
                                        </button>
                                    </td>
                                </tr>
                            </template>
                            <template x-if="containers.length === 0 && !loading">
                                <tr>
                                    <td colspan="3" class="text-center py-4 text-muted">
                                        <span x-show="!searchQuery.trim()">Nenhum contêiner cadastrado.</span>
                                        <span x-show="searchQuery.trim()">Nenhum contêiner encontrado para a busca.</span>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <div class="card-footer bg-white d-flex justify-content-between align-items-center py-3">
                    <span class="text-muted small">Página <strong x-text="page"></strong></span>
                    <div class="btn-group">
                        <button class="btn btn-outline-secondary btn-sm" @click="changePage(-1)" :disabled="page === 1">Anterior</button>
                        <button class="btn btn-outline-secondary btn-sm" @click="changePage(1)" :disabled="containers.length < pageSize">Próxima</button>
                    </div>
                </div>
            </div>
        </div>
    </template>


    <!-- 2. MODO CRIAÇÃO DE NOVO CONTÊINER -->
    <template x-if="viewMode === 'create'">
        <div>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2>Criar Novo Contêiner</h2>
                <button class="btn btn-outline-secondary btn-sm" @click="backToList()">
                    <i class="bi bi-x-lg"></i> Cancelar
                </button>
            </div>

            <!-- Dados do Contêiner -->
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-white"><h5 class="mb-0">Dados Principais</h5></div>
                <div class="card-body row g-3">
                    <div class="col-md-5">
                        <label class="form-label">Nome do Contêiner <span class="text-danger">*</span></label>
                        <input type="text" x-model="newContainer.name" class="form-control" placeholder="Ex: Lote 1024">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Data <span class="text-danger">*</span></label>
                        <input type="date" x-model="newContainer.data" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Status</label>
                        <select x-model="newContainer.status" class="form-select">
                            <option value="Pending">Pending</option>
                            <option value="Active">Active</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Inserção de Produtos com Autocomplete Flutuante -->
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Produtos no Contêiner</h5>
                    <span class="badge bg-primary">Total: <span x-text="newContainerTotalQty"></span> un.</span>
                </div>
                
                <div class="card-body bg-light border-bottom">
                    <form @submit.prevent="addTempItem()" class="row g-2 align-items-end">
                        <div class="col-md-7 position-relative" @click.outside="showProductDropdown = false">
                            <label class="form-label small text-muted">Buscar Produto (JanCode ou Nome)</label>
                            <input type="text" 
                                   x-model="productSearchQuery" 
                                   @input.debounce.300ms="onProductSearch()"
                                   @focus="showProductDropdown = true"
                                   class="form-control" 
                                   placeholder="Digite para buscar em tempo real...">
                            
                            <!-- MENU SUSPENSO FLUTUANTE DE DADOS DA API -->
                            <div class="list-group position-absolute w-100 shadow z-3 mt-1" 
                                 style="max-height: 220px; overflow-y: auto;"
                                 x-show="showProductDropdown && availableProducts.length > 0">
                                <template x-for="p in availableProducts" :key="p.ID || p.id">
                                    <button type="button" 
                                            class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-2"
                                            @click="selectProduct(p)">
                                        <span>
                                            <code class="me-2 text-dark fw-bold" x-text="p.jan_code || p.JanCode"></code>
                                            <span x-text="p.name || p.Name"></span>
                                        </span>
                                        <i class="bi bi-check2 text-primary fs-5" x-show="tempItem.product_id == (p.ID || p.id)"></i>
                                    </button>
                                </template>
                            </div>
                            
                            <div class="list-group position-absolute w-100 shadow z-3 mt-1" 
                                 x-show="showProductDropdown && availableProducts.length === 0">
                                <div class="list-group-item text-muted small py-2">Nenhum produto encontrado no banco.</div>
                            </div>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label small text-muted">Quantidade</label>
                            <input type="number" x-model="tempItem.quantity" class="form-control" min="1">
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-secondary w-100"><i class="bi bi-plus-lg"></i> Adicionar</button>
                        </div>
                    </form>
                </div>

                <div class="card-body p-0">
                    <table class="table align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>JanCode</th>
                                <th>Produto</th>
                                <th>Quantidade</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="(item, index) in newContainer.items" :key="index">
                                <tr>
                                    <td><code x-text="item.jan_code"></code></td>
                                    <td x-text="item.name"></td>
                                    <td><span class="badge bg-primary px-3 rounded-pill" x-text="item.quantity"></span></td>
                                    <td class="text-end">
                                        <button class="btn btn-sm btn-outline-danger" @click="removeTempItem(index)"><i class="bi bi-trash"></i></button>
                                    </td>
                                </tr>
                            </template>
                            <template x-if="newContainer.items.length === 0">
                                <tr><td colspan="4" class="text-center py-4 text-muted">Nenhum produto adicionado. Você pode salvar um contêiner vazio.</td></tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Ação Final -->
            <div class="d-flex justify-content-end gap-2 mb-5">
                <button class="btn btn-lg btn-light border" @click="backToList()" :disabled="loading">Cancelar</button>
                <button class="btn btn-lg btn-success" @click="saveNewContainer()" :disabled="loading">
                    <span x-show="loading" class="spinner-border spinner-border-sm me-2"></span>
                    Salvar Contêiner Definitivo
                </button>
            </div>
        </div>
    </template>


    <!-- 3. VISUALIZAÇÃO DE DETALHES DO CONTÊINER -->
    <template x-if="viewMode === 'details'">
        <div>
            <button class="btn btn-outline-secondary btn-sm mb-3" @click="backToList()">
                <i class="bi bi-arrow-left"></i> Voltar para Lista
            </button>

            <div class="card shadow-sm mb-4">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <h3 class="card-title mb-1" x-text="'Contêiner: ' + (selectedContainer.name || selectedContainer.Name)"></h3>
                        <p class="mb-0 text-muted"><strong>Status:</strong> <span x-text="selectedContainer.status || selectedContainer.Status"></span></p>
                    </div>
                    <div class="bg-light border rounded px-3 py-2 text-end">
                        <span class="text-muted d-block small fw-bold text-uppercase">Total de Itens</span>
                        <span class="fs-4 fw-bold text-primary" x-text="totalQuantity"></span>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="d-flex align-items-center gap-2">
                    <h4 class="mb-0">Itens do Contêiner</h4>
                    <span class="badge bg-primary fs-6 ms-2" x-text="'Total: ' + totalQuantity + ' un.'"></span>
                </div>
                <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalAddItem">
                    <i class="bi bi-plus-lg me-1"></i> Adicionar Item
                </button>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <table class="table align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>JanCode</th>
                                <th>Nome do Produto</th>
                                <th>Quantidade</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="item in (selectedContainer.item_containers || selectedContainer.items || selectedContainer.ItemContainers || [])" :key="item.product_id || item.ProductID">
                                <tr>
                                    <td><code x-text="getJanCode(item)"></code></td>
                                    <td x-text="getProductName(item)"></td>
                                    <td><span class="badge bg-primary rounded-pill px-3" x-text="item.quantity || item.Quantity"></span></td>
                                    <td class="text-end">
                                        <button class="btn btn-sm btn-outline-danger" @click="removeItem(item.product_id || item.ProductID)">Remover</button>
                                    </td>
                                </tr>
                            </template>
                            <template x-if="!(selectedContainer.item_containers || selectedContainer.items || selectedContainer.ItemContainers) || (selectedContainer.item_containers || selectedContainer.items || selectedContainer.ItemContainers).length === 0">
                                <tr><td colspan="4" class="text-center py-4 text-muted">Contêiner vazio.</td></tr>
                            </template>
                        </tbody>
                        <tfoot class="table-light border-top" x-show="totalQuantity > 0">
                            <tr class="fw-bold">
                                <td colspan="2" class="text-end">TOTAL ACUMULADO:</td>
                                <td>
                                    <span class="badge bg-dark rounded-pill px-3" x-text="totalQuantity + ' unidades'"></span>
                                </td>
                                <td></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>

            <!-- MODAL ADICIONAR ITEM A CONTÊINER EXISTENTE -->
            <div class="modal fade" id="modalAddItem" tabindex="-1">
                <div class="modal-dialog">
                    <form class="modal-content" @submit.prevent="addItem()">
                        <div class="modal-header">
                            <h5 class="modal-title">Adicionar Produto ao Contêiner</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3 position-relative" @click.outside="showProductDropdown = false">
                                <label class="form-label">Buscar Produto (JanCode ou Nome)</label>
                                <input type="text" 
                                       x-model="productSearchQuery" 
                                       @input.debounce.300ms="onProductSearch()"
                                       @focus="showProductDropdown = true"
                                       class="form-control" 
                                       placeholder="Digite para buscar em tempo real..." required>
                                
                                <div class="list-group position-absolute w-100 shadow z-3 mt-1" 
                                     style="max-height: 200px; overflow-y: auto;"
                                     x-show="showProductDropdown && availableProducts.length > 0">
                                    <template x-for="p in availableProducts" :key="p.ID || p.id">
                                        <button type="button" 
                                                class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-2"
                                                @click="selectProduct(p)">
                                            <span>
                                                <code class="me-2 text-dark fw-bold" x-text="p.jan_code || p.JanCode"></code>
                                                <span x-text="p.name || p.Name"></span>
                                            </span>
                                            <i class="bi bi-check2 text-primary fs-5" x-show="newItem.product_id == (p.ID || p.id)"></i>
                                        </button>
                                    </template>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Quantidade</label>
                                <input type="number" x-model="newItem.quantity" class="form-control" required min="1">
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="submit" class="btn btn-success">Adicionar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </template>
</div>
