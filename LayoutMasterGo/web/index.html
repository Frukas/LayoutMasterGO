<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Master - SPA Alpine.js</title>
    <!-- ÍCONE DA ABA DO NAVEGADOR -->
    <link rel="icon" type="image/png" href="/static/img/favicon.png">
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: #212529; color: white; padding: 20px; display: flex; flex-direction: column; }
        .sidebar .nav-link { color: #adb5bd; margin-bottom: 5px; border-radius: 5px; cursor: pointer; }
        .sidebar .nav-link.active, .sidebar .nav-link:hover { color: #fff; background: rgba(255,255,255,0.1); }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
    </style>
</head>
<body x-data="appRouter">

    <!-- BARRA LATERAL DE NAVEGAÇÃO -->
    <div class="sidebar">
        
        <h4 class="mb-4 text-info"><i class="bi bi-box-seam"></i> Layout Master</h4>
        <nav class="nav flex-column">
            <a class="nav-link" :class="{ 'active': activeTab === 'containers' }" @click="navigate('containers')">
                <i class="bi bi-archive me-2"></i> Contêineres
            </a>
            <a class="nav-link" :class="{ 'active': activeTab === 'products' }" @click="navigate('products')">
                <i class="bi bi-tags me-2"></i> Produtos
            </a>
        </nav>
    <div class="mt-auto text-center pt-3">
        <img src="/static/img/favicon.png" alt="Logo" class="img-fluid">
    </div>
    </div>

    <!-- ÁREA DE CONTEÚDO DINÂMICO (Manipulado pelo app.js) -->
    <div class="main-content">
        <div id="view-area">
            <div class="text-center mt-5 text-muted">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2">Carregando painel...</p>
            </div>
        </div>
    </div>

    <!-- CONTÊINER FLUTUANTE DE TOAST NOTIFICATIONS -->
  <div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3" style="z-index: 1090;">
        <div id="appToast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- SCRIPTS (Ordem de carregamento mandatória) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/products.js"></script>
    <script src="/static/js/containers.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
